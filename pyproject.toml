[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platemap"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "reportlab",
]

[project.optional-dependencies]
notebook = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "nbformat",
    "nbconvert",
    "ipykernel",
]
dev = [
    "pytest",
]

[project.scripts]
platemap = "platemap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
